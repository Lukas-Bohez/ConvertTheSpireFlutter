name: convert_the_spire_reborn
# Also the Microsoft Store package's description (msix), which may not end in
# a space: hence >- (no trailing newline).
description: >-
  All-in-one media app: download from 1800+ sites, convert 27+ formats,
  play, cast to DLNA/UPnP, and download torrents.
publish_to: 'none'
version: 16.0.1+1305

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0
  path_provider_platform_interface: ^2.1.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.6.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.2
  # file_picker: ^12.0.0-beta.5 (reverted to stable below)
  url_launcher: ^6.2.5
  youtube_explode_dart: ^3.0.0
  provider: ^6.0.5
  video_player: ^2.5.1
  archive: ^4.0.9
  image: ^4.3.0
  shared_preferences: ^2.5.5
  in_app_review: ^2.0.9
  in_app_update: ^4.2.3
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  google_mobile_ads: ^8.0.0
  in_app_purchase: ^3.2.3
  window_manager: 0.5.1
  shimmer: ^3.0.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_linux: 1.2.1
  media_kit_native_event_loop: ^1.0.2
  flutter_inappwebview: 6.1.5
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  just_audio: 0.10.5
  just_audio_windows: ^0.2.2
  audio_service: 0.18.18
  # 0.4.9 from pub.dev with two fixes that let magnet links get their file
  # list; see third_party/dtorrent_task_v2/README.md.
  dtorrent_task_v2:
    path: third_party/dtorrent_task_v2
  fl_chart: ^1.2.0
  audio_metadata_reader: ^1.6.0
  metadata_god: ^1.1.0
  # metadata_god 1.1.0's prebuilt Rust library is codegen'd with
  # flutter_rust_bridge 2.11.1, but pub otherwise resolves a newer frb runtime
  # (2.12.0), and RustLib.init() then throws
  # "Bad state: metadata_god's codegen version (2.11.1) should be the same as
  # runtime version (2.12.0)" on every library refresh / folder pick
  # (observed in startup_errors.log on Windows). Pin the runtime to the
  # codegen version; metadata_god has no newer release to move to.
  flutter_rust_bridge: 2.11.1
  csv: ^8.0.0
  pdf: ^3.12.0
  multicast_dns: 0.3.3
  ffmpeg_kit_flutter_new: ^4.1.0
  flutter_local_notifications: 21.0.0
  tray_manager: 0.5.2
  # Explicitly pinned transitive dependencies to avoid future resolution breakage
  crypto: ^3.0.3
  win32: ^5.15.0
  ffi: ^2.1.0
  uuid: ^4.5.1
  file_picker: ^10.3.10
  path: ^1.9.0
  b_encode_decode: ^1.0.5
  bittorrent_dht: ^0.0.15
  dtorrent_common: ^1.0.8
  desktop_drop: ^0.7.0
  flutter_secure_storage: ^10.0.0
  go_router: ^17.2.0
  webview_windows:
    path: third_party/webview_windows
  video_thumbnail: 0.5.6
  qr: ^3.0.2
  cryptography: ^2.9.0
  dio: ^5.9.2
  flutter_markdown_plus: ^1.0.7
  get_it: ^9.2.1
  # win32: ^6.3.0 (reverted to ^5.15.0 above for compatibility)
  audioplayers: ^6.6.0

  mime: any
  characters: any
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico
    - assets/icons/favicon-192x192.png
    - assets/icons/app_logo_384.png
    # Bundled so the app can show what changed after it updates itself.
    - CHANGELOG.md
  shaders: []

# The Microsoft Store package (MSIX), made by .github/workflows/msstore.yml:
# `flutter build windows --dart-define=MS_STORE_BUILD=true`, FFmpeg, yt-dlp
# and Deno put next to the exe, then `dart run msix:create`. The package's
# identity comes from Partner Center (Product identity); the workflow passes
# it in, so identity_name, publisher and publisher_display_name below are
# placeholders. See docs/store/microsoft-store.md.
msix_config:
  display_name: Convert The Spire Reborn
  publisher_display_name: Oroka Conner
  identity_name: OrokaConner.ConvertTheSpireReborn
  publisher: CN=00000000-0000-0000-0000-000000000000
  logo_path: assets/icons/app_icon_fixed.png
  # runFullTrust is always added. Torrents and the local media server
  # accept connections, from the internet and from the home network.
  capabilities: internetClient,internetClientServer,privateNetworkClientServer
  # What the app offers to open, as the other builds do (open_requests.cpp).
  file_extension: .torrent,.mp3,.m4a,.flac,.wav,.ogg,.opus,.aac,.wma,.mp4,.mkv,.avi,.webm,.mov,.wmv,.flv,.m4v
  protocol_activation: magnet
  # The app's 18 languages, so the Store lists them and Partner Center
  # offers a listing for each (docs/publishing/store-listing/).
  languages: en-us,ar,de,es,fr,hi,id,it,ja,ko,nl,pl,pt-br,ru,tr,uk,vi,zh-cn
  architecture: x64
  os_min_version: 10.0.17763.0
  store: true
  build_windows: false
  output_name: ConvertTheSpireReborn
