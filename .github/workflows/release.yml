# Convert The Spire Reborn - Release Workflow
#
# Triggered manually via workflow_dispatch. Runs tests, builds release
# artifacts for all platforms, and publishes a GitHub Release with a
# SHA-256 checksum manifest.
#
# Required secrets (configure in Settings -> Secrets and variables -> Actions):
#
#   macOS signing & notarization (optional; omit to ship unsigned):
#     MACOS_CERTIFICATE_BASE64  - base64-encoded .p12 Developer ID certificate
#     MACOS_CERTIFICATE_PASSWORD - .p12 import password
#     MACOS_NOTARIZE_APPLE_ID   - Apple ID used for notarization
#     MACOS_NOTARIZE_PASSWORD   - App-specific password for that Apple ID
#     MACOS_NOTARIZE_TEAM_ID    - 10-character Apple Team ID
#
name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to publish (e.g. v1.2.3)'
        required: true
        type: string
      release_name:
        description: 'Release name (e.g. "Version 1.2.3 - My Awesome Release")'
        required: true
        type: string
      release_notes:
        description: 'Detailed release notes (Markdown)'
        required: true
        type: string
      is_prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.41.2'
  APP_NAME: convert_the_spire_reborn
  OUTPUT_NAME: ConvertTheSpireReborn
  ANDROID_APK_NAME: ConvertTheSpireReborn.apk
  ANDROID_AAB_NAME: ConvertTheSpireReborn.aab
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ---------------------------------------------------------------------------
# Shared permissions: contents:write only on the publish job; all others
# use the minimal read-only default.
# ---------------------------------------------------------------------------
permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Test & static analysis - gate for all build jobs
  # =========================================================================
  test-and-analyze:
    name: Test and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      # Upload coverage so it's available in the release notes / CI history
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # =========================================================================
  # 2. Windows x64
  # =========================================================================
  build-windows:
    name: Build Windows
    needs: test-and-analyze
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      # Set _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS at the
      # CMake / environment level so all plugin targets inherit it.
      - name: Set coroutine deprecation workaround
        shell: pwsh
        run: |
          echo "CXXFLAGS=-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CMAKE_CXX_FLAGS=-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" | Out-File -FilePath $env:GITHUB_ENV -Append

      # metadata_god's resolve_symlinks.ps1 fails on CI runners because
      # it tries to Get-Item on C:\Users\runneradmin\AppData which doesn't
      # exist. Patch the script to handle this gracefully.
      - name: Patch metadata_god resolve_symlinks for CI
        shell: pwsh
        run: |
          $paths = @(
            "$env:PUB_CACHE\hosted\pub.dev\metadata_god-*\cargokit\cmake\resolve_symlinks.ps1",
            "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev\metadata_god-*\cargokit\cmake\resolve_symlinks.ps1",
            "windows\flutter\ephemeral\.plugin_symlinks\metadata_god\cargokit\cmake\resolve_symlinks.ps1"
          )
          foreach ($pattern in $paths) {
            $files = Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
            foreach ($file in $files) {
              $text = Get-Content -Raw $file.FullName
              if ($text -match 'Get-Item \$realPath') {
                $text = $text -replace 'Get-Item \$realPath', 'Get-Item -ErrorAction SilentlyContinue $realPath'
                Set-Content -Path $file.FullName -Value $text -NoNewline
                Write-Host "Patched resolve_symlinks.ps1 at $($file.FullName)"
              }
            }
          }
          Write-Host "metadata_god patch check complete"

      - name: Patch flutter_inappwebview Windows symbol mismatch
        shell: pwsh
        run: |
          $candidates = @(
            "$env:PUB_CACHE\hosted\pub.dev\flutter_inappwebview_windows-0.6.0\windows\custom_platform_view\custom_platform_view.cc",
            "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev\flutter_inappwebview_windows-0.6.0\windows\custom_platform_view\custom_platform_view.cc",
            "windows\flutter\ephemeral\.plugin_symlinks\flutter_inappwebview_windows\windows\custom_platform_view\custom_platform_view.cc"
          )

          $patched = 0
          foreach ($file in $candidates) {
            if (Test-Path $file) {
              $text = Get-Content -Raw $file
              $newText = $text -replace '\bwebview_\b', 'view'
              if ($newText -ne $text) {
                Set-Content -Path $file -Value $newText -NoNewline
                Write-Host "Patched $file"
                $patched++
              }
            }
          }

          if ($patched -eq 0) {
            Write-Host "No symbol patch was needed."
          }

      - name: Build Windows release
        run: flutter build windows --release --no-tree-shake-icons --dart-define=PLAY_STORE_BUILD=false --dart-define=GITHUB_RELEASE=true

      - name: Package Windows build
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (!(Test-Path $src)) {
            Write-Error "Build output not found: $src"
            exit 1
          }
          Compress-Archive -Path "$src\*" `
            -DestinationPath "${{ env.OUTPUT_NAME }}-windows-x64.zip" `
            -Force

      - uses: actions/upload-artifact@v5
        with:
          name: windows-x64
          path: ${{ env.OUTPUT_NAME }}-windows-x64.zip
          retention-days: 7

  # =========================================================================
  # 3. Linux x64  (zip + AppImage when build script is present)
  # =========================================================================
  build-linux:
    name: Build Linux
    needs: test-and-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Flutter Linux requires these system libraries
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev \
            libmpv-dev mpv libass-dev \
            fuse libfuse2 \
            libayatana-appindicator3-dev \
            libjson-glib-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release --no-tree-shake-icons --dart-define=PLAY_STORE_BUILD=false --dart-define=GITHUB_RELEASE=true

      - name: Package Linux zip
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/build/linux/x64/release/bundle"
          if [ ! -d "$BUNDLE" ]; then
            echo "ERROR: bundle not found at $BUNDLE"
            exit 1
          fi
          cd "$BUNDLE"
          zip -r "$GITHUB_WORKSPACE/${{ env.OUTPUT_NAME }}-linux-x64.zip" .

      # Build the AppImage only when the helper script is present in the repo.
      # If you haven't added one yet, this step is skipped gracefully.
      - name: Build AppImage (if script exists)
        id: appimage
        run: |
          if [ -f "scripts/build-appimage.sh" ]; then
            chmod +x scripts/build-appimage.sh
            bash scripts/build-appimage.sh
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts/build-appimage.sh not found - skipping AppImage build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      # Upload zip unconditionally; AppImage only if it was actually built
      - uses: actions/upload-artifact@v5
        with:
          name: linux-x64
          path: |
            ${{ env.OUTPUT_NAME }}-linux-x64.zip
            ${{ steps.appimage.outputs.built == 'true' && format('{0}-linux-x64.AppImage', env.OUTPUT_NAME) || '' }}
          retention-days: 7

  # =========================================================================
  # 4. macOS (universal / arm64 + x64)
  # =========================================================================
  build-macos:
    name: Build macOS
    needs: test-and-analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release --no-tree-shake-icons --no-codesign

      - name: Package macOS build
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release \
            -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "ERROR: .app bundle not found"; exit 1; }
          ditto -c -k --keepParent "$APP" \
            "${{ env.OUTPUT_NAME }}-macOS.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: macos-x64
          path: ${{ env.OUTPUT_NAME }}-macOS.zip
          retention-days: 7

  # =========================================================================
  # 5. Android (GitHub APK + Play Store AAB)
  # =========================================================================
  build-android:
    name: Build Android
    needs: test-and-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (GitHub release flavor)
        run: flutter build apk --flavor full --release --no-tree-shake-icons --dart-define=PLAY_STORE_BUILD=false --dart-define=GITHUB_RELEASE=true

      - name: Build AAB (Play Store flavor)
        run: flutter build appbundle --flavor play --release --no-tree-shake-icons --dart-define=PLAY_STORE_BUILD=true --dart-define=GITHUB_RELEASE=false

      - name: Verify release tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail
          version_line=$(grep -E '^version:' pubspec.yaml | head -n 1)
          version_value="${version_line#version: }"
          # Trim leading/trailing whitespace (grep output may have trailing newline)
          version_value="${version_value#"${version_value%%[![:space:]]*}"}"
          version_value="${version_value%"${version_value##*[![:space:]]}"}"
          # version_value may include build metadata (+<code>), accept tags
          # both with and without that suffix: v12.1.8+1218 and v12.1.8
          version_name=${version_value%%+*}
          expected_tag_full="v${version_value}"
          expected_tag_name="v${version_name}"

          if [ "${{ inputs.release_tag }}" != "$expected_tag_full" ] && [ "${{ inputs.release_tag }}" != "$expected_tag_name" ]; then
            echo "Expected release tag $expected_tag_full or $expected_tag_name but got ${{ inputs.release_tag }}"
            exit 1
          fi

      - name: Collect Android artifacts
        run: |
          mkdir -p android-builds
          # APK goes to GitHub Release
          cp build/app/outputs/flutter-apk/app-full-release.apk \
            android-builds/${{ env.ANDROID_APK_NAME }}

      - uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: android-builds/
          retention-days: 7

      - name: Collect Play Store AAB
        run: |
          mkdir -p android-aab
          cp build/app/outputs/bundle/playRelease/app-play-release.aab \
            android-aab/${{ env.ANDROID_AAB_NAME }}

      - uses: actions/upload-artifact@v5
        with:
          name: android-aab-play
          path: android-aab/
          retention-days: 7

  # =========================================================================
  # 6. Publish GitHub Release
  # =========================================================================
  release:
    name: Publish Release
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create releases and upload assets

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      # Verify that every expected platform produced at least one file.
      - name: Verify artifact completeness
        run: |
          set -euo pipefail
          missing=0
          for dir in windows-x64 linux-x64 macos-x64 android-apk; do
            count=$(find "artifacts/$dir" -type f 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "ERROR: No files found in artifacts/$dir"
              missing=1
            else
              echo "OK: artifacts/$dir ($count file(s))"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # Generate a SHA-256 manifest so users can verify downloads.
      # Explicitly excludes coverage report and other non-release artifacts.
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          find . -type f \
            ! -name "*.sha256" \
            ! -path "*/coverage-report/*" \
          | sort | xargs sha256sum > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.is_prerelease }}
          fail_on_unmatched_files: true
          files: |
            artifacts/windows-x64/*.zip
            artifacts/linux-x64/*
            artifacts/macos-x64/*.zip
            artifacts/android-apk/${{ env.ANDROID_APK_NAME }}
            SHA256SUMS.txt